# GDP data repository CI (template v1 — templates/repository-onboarding/ci-workflow.yml).
# Copy to .github/workflows/dbt-ci.yml in the data repository (readiness check 7 looks for "dbt build").
#
# - DuckDB (default): builds and tests the dbt project against the synthetic fixtures committed under
#   tests/fixtures/<table>.csv (one file per landing table of the `raw` source schema, generated by the app's
#   generate_fixtures tool from the spec's column contracts). No secrets, no real data.
# - The warehouse target comes from the repository variable GDP_WAREHOUSE (duckdb | snowflake). A Snowflake
#   target uses CBRE-managed CI credentials configured outside the app; the app never reads or writes CI secrets.
# - A model or test that references a column absent from the fixtures fails `dbt build`, naming the column.
name: dbt-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dbt:
    name: dbt build and tests (${{ vars.GDP_WAREHOUSE || 'duckdb' }})
    runs-on: ubuntu-latest
    env:
      GDP_WAREHOUSE: ${{ vars.GDP_WAREHOUSE || 'duckdb' }}
      DBT_PROJECT_DIR: ${{ vars.DBT_PROJECT_DIR || '.' }}
      DBT_SEND_ANONYMOUS_USAGE_STATS: "False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          if [ "$GDP_WAREHOUSE" = "snowflake" ]; then
            pip install "dbt-core==1.12.7" "dbt-snowflake==1.12.5"
          else
            pip install "dbt-core==1.12.7" "dbt-duckdb==1.11.1" "duckdb==1.5.6"
          fi

      - name: Warehouse-agnostic SQL lint (DuckDB-only functions only inside adapter.dispatch macros)
        run: |
          python - <<'PY'
          import pathlib, re, sys
          project = pathlib.Path("${{ env.DBT_PROJECT_DIR }}")
          duckdb_only = re.compile(r"\b(read_csv(_auto)?|read_parquet|read_json(_auto)?|strptime|list_value|"
                                   r"struct_pack|epoch_ms|regexp_matches|string_split|list_aggregate)\s*\(", re.I)
          bad = []
          for sql in sorted(project.glob("models/**/*.sql")):
              for n, line in enumerate(sql.read_text(encoding="utf-8").splitlines(), 1):
                  if duckdb_only.search(line):
                      bad.append(f"{sql}:{n}: {line.strip()}")
          if bad:
              print("DuckDB-only SQL outside adapter.dispatch macros (move it into a macro under macros/):")
              print("\n".join(bad))
              sys.exit(1)
          print("ok: models are warehouse-agnostic")
          PY

      - name: Write the CI profile (no secrets for DuckDB)
        run: |
          python - <<'PY'
          import os, pathlib, yaml
          project = pathlib.Path(os.environ["DBT_PROJECT_DIR"])
          profile = yaml.safe_load((project / "dbt_project.yml").read_text())["profile"]
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "profiles"
          out.mkdir(parents=True, exist_ok=True)
          if os.environ["GDP_WAREHOUSE"] == "snowflake":
              target = {"type": "snowflake", "account": "{{ env_var('SNOWFLAKE_ACCOUNT') }}",
                        "user": "{{ env_var('SNOWFLAKE_USER') }}",
                        "authenticator": "oauth", "token": "{{ env_var('SNOWFLAKE_TOKEN') }}",
                        "role": "{{ env_var('SNOWFLAKE_ROLE') }}", "warehouse": "{{ env_var('SNOWFLAKE_WAREHOUSE') }}",
                        "database": "{{ env_var('SNOWFLAKE_DATABASE') }}", "schema": "{{ env_var('SNOWFLAKE_SCHEMA') }}",
                        "threads": 4}
          else:
              target = {"type": "duckdb", "path": str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "ci.duckdb"),
                        "schema": "main", "threads": 4}
          (out / "profiles.yml").write_text(yaml.safe_dump({profile: {"target": "ci", "outputs": {"ci": target}}}))
          print(f"profile {profile} -> {os.environ['GDP_WAREHOUSE']}")
          PY

      - name: Load synthetic fixtures (tests/fixtures/*.csv -> raw.<table>, all text)
        if: env.GDP_WAREHOUSE == 'duckdb'
        run: |
          python - <<'PY'
          import os, pathlib, duckdb
          fixtures = sorted(pathlib.Path("tests/fixtures").glob("*.csv"))
          con = duckdb.connect(str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "ci.duckdb"))
          con.execute("CREATE SCHEMA IF NOT EXISTS raw")
          for f in fixtures:
              table = f.stem
              con.execute(f'CREATE OR REPLACE TABLE raw."{table}" AS '
                          f"SELECT * FROM read_csv(?, header=true, all_varchar=true)", [str(f)])
              print(f"raw.{table}: {con.execute(f'SELECT count(*) FROM raw.\"{table}\"').fetchone()[0]} rows")
          if not fixtures:
              print("no fixtures under tests/fixtures/ (models reading raw.* will fail)")
          con.close()
          PY

      - name: dbt build (models and tests)
        env:
          SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
        run: |
          dbt deps --project-dir "$DBT_PROJECT_DIR" --profiles-dir "$RUNNER_TEMP/profiles" || true
          dbt build --project-dir "$DBT_PROJECT_DIR" --profiles-dir "$RUNNER_TEMP/profiles" --target ci
