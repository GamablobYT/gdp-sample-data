# Silver product checks (CDO-20): severity FAIL. At least one check per mandatory CDE; each names its DQ rule, the
# CDE and the acceptance criteria it proves. Link-rate checks of Enterprise ID linkage (CDO-10) warn by default.
dataset: ticket/main/slv_{entity}
columns:
  - name: "{cde_column}"
    checks:
      - missing:
          name: "{cde_column}_missing"
          attributes: {severity: fail, dq_rule: DQ-nn, cde: "{cde_column}", acceptance_criteria: [AC-nn]}
  - name: enterprise_{entity}_id
    checks:
      - missing:
          name: link_rate_{entity}
          threshold:
            metric: percent
            must_be_less_than: 5          # 100% - the spec's link rate threshold
          attributes: {link_rate: true, severity: warn, dq_rule: DQ-nn, acceptance_criteria: [AC-nn]}
checks:
  - row_count:
      name: slv_{entity}_rows
      threshold:
        must_be_greater_than: 0
