version: 2

models:
  - name: slv_leases
    description: Cleaned leases (trimmed keys, upper-case currency, lease length in days).
    columns:
      - name: lease_id
        data_tests: [not_null, unique]
      - name: property_id
        data_tests: [not_null]
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: ["GBP", "EUR", "USD"]
